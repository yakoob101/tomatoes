<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>🍅 Tomato Toss</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        font-family:
          ui-rounded,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: radial-gradient(
          circle at 50% -10%,
          #fffdf6 0%,
          #fdf3dd 38%,
          #f6e2bd 72%,
          #eed0a1 100%
        );
        display: flex;
        flex-direction: column;
        user-select: none;
        -webkit-user-select: none;
      }

      header {
        flex: 0 0 auto;
        padding: 16px 16px 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      #scorebox {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 26px 8px 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.75);
        border: 2px solid #fff;
        box-shadow:
          0 10px 26px rgba(150, 100, 50, 0.18),
          inset 0 -3px 0 rgba(200, 150, 90, 0.14);
        color: #4b2b18;
        font-weight: 800;
        font-size: 38px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      #scorebox .icon {
        font-size: 27px;
        filter: drop-shadow(0 2px 2px rgba(160, 40, 30, 0.25));
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .seg {
        display: flex;
        gap: 2px;
        padding: 4px;
        background: rgba(255, 255, 255, 0.6);
        border: 2px solid #fff;
        border-radius: 999px;
        box-shadow: 0 6px 16px rgba(150, 100, 50, 0.13);
      }
      .seg-btn {
        font: inherit;
        font-weight: 700;
        font-size: 15px;
        color: #8a6a4c;
        background: transparent;
        border: 0;
        cursor: pointer;
        padding: 7px 20px;
        border-radius: 999px;
        transition:
          background 0.15s,
          color 0.15s,
          transform 0.1s,
          box-shadow 0.15s;
      }
      .seg-btn:hover {
        color: #4b2b18;
      }
      .seg-btn.active {
        background: #e8382a;
        color: #fff;
        box-shadow: 0 3px 9px rgba(200, 50, 40, 0.35);
      }
      .seg-btn:active {
        transform: scale(0.96);
      }

      #reset,
      #sound {
        font: inherit;
        font-weight: 700;
        font-size: 15px;
        color: #8a6a4c;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.6);
        border: 2px solid #fff;
        border-radius: 999px;
        padding: 9px 20px;
        box-shadow: 0 6px 16px rgba(150, 100, 50, 0.13);
        transition:
          transform 0.1s,
          color 0.15s,
          background 0.15s,
          opacity 0.15s;
      }
      #reset:hover,
      #sound:hover {
        color: #b5281d;
        background: #fff;
      }
      #reset:active,
      #sound:active {
        transform: scale(0.96);
      }
      #sound {
        padding: 9px 12px;
        font-size: 16px;
        line-height: 1;
        min-width: 44px;
      }
      #sound.off {
        opacity: 0.45;
      }

      .skin {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.6);
        border: 2px solid #fff;
        box-shadow: 0 6px 16px rgba(150, 100, 50, 0.13);
      }
      .skin-tag {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.04em;
        color: #a8835c;
        white-space: nowrap;
        user-select: none;
      }
      .skin-tag.hard {
        color: #8a3f22;
      }
      .skin input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 140px;
        height: 10px;
        border-radius: 999px;
        outline: none;
        cursor: pointer;
        background: linear-gradient(
          90deg,
          #33201a 0%,
          #8a5535 50%,
          #ffe0c8 100%
        );
      }
      .skin input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        border: 3px solid #8a6a4c;
        box-shadow: 0 2px 6px rgba(90, 60, 30, 0.3);
      }
      .skin input[type="range"]::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        border: 3px solid #8a6a4c;
        box-shadow: 0 2px 6px rgba(90, 60, 30, 0.3);
      }

      #girl .skin,
      #boy .skin {
        fill: var(--skin, #f7cdad);
      }
      #girl .skin-shade,
      #boy .skin-shade {
        fill: var(--skin-shade, #eab894);
      }
      #girl .skin-line,
      #boy .skin-line {
        stroke: var(--skin-line, #e0a683);
      }

      #stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
        touch-action: none;
        cursor: crosshair;
        contain: layout style;
      }

      #shadow {
        position: absolute;
        left: 50%;
        bottom: 1.5%;
        width: clamp(120px, 24vh, 170px);
        height: 24px;
        transform: translateX(-50%);
        background: radial-gradient(
          ellipse at center,
          rgba(120, 80, 40, 0.22),
          rgba(120, 80, 40, 0) 70%
        );
      }

      .char {
        position: absolute;
        left: 50%;
        bottom: 4%;
        width: clamp(170px, 42vh, 300px);
        transform: translateX(-50%);
        transform-origin: 50% 92%;
        pointer-events: none;
      }
      #girl *,
      #boy * {
        pointer-events: auto;
      }
      .char.blasted {
        animation: blast 0.7s cubic-bezier(0.35, 0.05, 0.6, 1) forwards;
      }
      @keyframes blast {
        0% {
          transform: translateX(-50%) translate(0, 0) rotate(0) scale(1);
          opacity: 1;
        }
        100% {
          transform: translateX(-50%) translate(42vw, -110vh) rotate(200deg)
            scale(0.35);
          opacity: 0;
        }
      }
      .char.respawn {
        animation: respawn 0.5s ease-out;
      }
      @keyframes respawn {
        0% {
          transform: translateX(-50%) translateY(50px) scale(0.86);
          opacity: 0;
        }
        55% {
          transform: translateX(-50%) translateY(-8px) scale(1.03);
          opacity: 1;
        }
        100% {
          transform: translateX(-50%) translateY(0) scale(1);
          opacity: 1;
        }
      }

      #girl,
      #boy {
        display: none;
        width: 100%;
        height: auto;
        overflow: visible;
        transform-origin: 50% 92%;
        animation: idle 3s ease-in-out infinite;
        filter: drop-shadow(0 14px 18px rgba(120, 80, 40, 0.16));
      }
      #girl.active,
      #boy.active {
        display: block;
      }
      #girl.switching,
      #boy.switching {
        animation: popIn 0.3s ease-out;
      }
      @keyframes idle {
        0%,
        100% {
          transform: translateY(0) rotate(-1deg);
        }
        50% {
          transform: translateY(-7px) rotate(1deg);
        }
      }
      @keyframes popIn {
        0% {
          transform: scale(0.9);
        }
        60% {
          transform: scale(1.04);
        }
        100% {
          transform: scale(1);
        }
      }

      #fx,
      #splats,
      #juice,
      #ammo {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #ammo {
        overflow: visible;
      }
      #pops {
        position: fixed;
        pointer-events: none;
        overflow: visible;
        z-index: 40;
      }

      .tomato {
        position: absolute;
        width: 42px;
        height: 39px;
        border-radius: 50% 50% 47% 47%;
        background: radial-gradient(
          circle at 34% 28%,
          #ff7a63 0%,
          #e8382a 45%,
          #a9180f 100%
        );
        box-shadow:
          inset -4px -5px 10px rgba(0, 0, 0, 0.28),
          0 4px 10px rgba(140, 40, 30, 0.25);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .tomato::before {
        content: "";
        position: absolute;
        top: -8px;
        left: 50%;
        width: 24px;
        height: 19px;
        transform: translateX(-50%);
        background: #3f9142;
        clip-path: polygon(
          50% 55%,
          82% 92%,
          68% 50%,
          100% 30%,
          60% 35%,
          50% 0%,
          40% 35%,
          0 30%,
          32% 50%,
          18% 92%
        );
      }
      .tomato::after {
        content: "";
        position: absolute;
        top: -13px;
        left: 50%;
        width: 6px;
        height: 10px;
        border-radius: 3px;
        transform: translateX(-50%) rotate(6deg);
        background: #2f7032;
      }

      .tomato.big {
        width: 130px;
        height: 120px;
        box-shadow:
          inset -14px -18px 40px rgba(0, 0, 0, 0.3),
          0 20px 60px rgba(140, 40, 30, 0.35);
      }
      .tomato.big::before {
        top: -24px;
        width: 76px;
        height: 60px;
      }
      .tomato.big::after {
        top: -40px;
        width: 18px;
        height: 30px;
        border-radius: 9px;
      }

      .tomato.held {
        left: 50%;
        top: 30.5%;
        z-index: 3;
      }

      #flash {
        position: fixed;
        inset: 0;
        z-index: 60;
        pointer-events: none;
        background: radial-gradient(circle at 50% 45%, #f25a45, #d0271a 70%);
        opacity: 0;
      }

      .drop {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          #f0543f,
          #c62b1f 70%,
          #a3180f
        );
        box-shadow: 0 1px 2px rgba(120, 20, 10, 0.25);
        transform: translate(-50%, -50%);
      }

      .ring {
        position: absolute;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border: 3px solid rgba(214, 52, 38, 0.45);
        transform: translate(-50%, -50%);
      }

      .splat {
        position: absolute;
        width: 0;
        height: 0;
      }
      .splat svg {
        position: absolute;
        left: -76px;
        top: -76px;
        width: 152px;
        height: 152px;
        overflow: visible;
      }

      .pop {
        position: absolute;
        transform: translate(-50%, -50%);
        font-size: 34px;
        font-weight: 900;
        color: #fff;
        letter-spacing: 0.5px;
        text-shadow:
          0 2px 0 #b5281d,
          0 0 12px rgba(180, 40, 30, 0.55);
      }
    </style>
  </head>

    <script>
      const stage = document.getElementById("stage");
      const ammo = document.getElementById("ammo");
      const splats = document.getElementById("splats");
      const juice = document.getElementById("juice");
      const pops = document.getElementById("pops");
      const scoreEl = document.getElementById("score");
      const scoreBox = document.getElementById("scorebox");
      const resetBtn = document.getElementById("reset");
      const charWrap = document.querySelector(".char");
      const girlEl = document.getElementById("girl");
      const boyEl = document.getElementById("boy");
      const flashEl = document.getElementById("flash");
      const skinSlider = document.getElementById("skin-tone");

      const SPLAT_COLORS = ["#c92c22", "#b5231b", "#d93a2b", "#bf2a20"];
      const FLIGHT_MS = 380;

      let score = 0;
      let current = "girl";
      let busy = false;
      let snacking = false;
      let hitsSinceBig = 0;
      let bigThreshold = 100 + ((Math.random() * 201) | 0);
      let snackHits = 0;
      let snackThreshold = 10;
      let combo = 0;
      let comboAt = -1e9;

      /* ---------- sound ---------- */

      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      let actx = null,
        master = null,
        noiseBuf = null,
        muted = false;

      function ac() {
        if (!AudioCtx) return null;
        if (!actx) {
          actx = new AudioCtx();
          master = actx.createGain();
          master.gain.value = 0.7;
          master.connect(actx.destination);
          noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
          const d = noiseBuf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        if (actx.state === "suspended") actx.resume();
        return actx;
      }

      function blip(freq, dur, type, vol, when, slideTo, atk) {
        if (muted) return;
        const c = ac();
        if (!c) return;
        const t0 = c.currentTime + (when || 0);
        const o = c.createOscillator(),
          g = c.createGain();
        o.type = type || "sine";
        o.frequency.setValueAtTime(freq, t0);
        if (slideTo)
          o.frequency.exponentialRampToValueAtTime(
            Math.max(1, slideTo),
            t0 + dur,
          );
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(
          vol,
          t0 + (atk == null ? 0.012 : atk),
        );
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g);
        g.connect(master);
        o.start(t0);
        o.stop(t0 + dur + 0.03);
      }

      function hiss(dur, vol, when, type, freq, freqTo, q, atk) {
        if (muted) return;
        const c = ac();
        if (!c) return;
        const t0 = c.currentTime + (when || 0);
        const src = c.createBufferSource();
        src.buffer = noiseBuf;
        const f = c.createBiquadFilter();
        f.type = type || "bandpass";
        f.frequency.setValueAtTime(freq || 1200, t0);
        if (freqTo)
          f.frequency.exponentialRampToValueAtTime(
            Math.max(20, freqTo),
            t0 + dur,
          );
        f.Q.value = q == null ? 1 : q;
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(
          vol,
          t0 + (atk == null ? 0.01 : atk),
        );
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        src.connect(f);
        f.connect(g);
        g.connect(master);
        src.start(t0);
        src.stop(t0 + dur + 0.03);
      }

      const sfx = {
        throw() {
          hiss(0.18, 0.09, 0, "bandpass", 700, 2600, 1.2);
          blip(430, 0.08, "triangle", 0.04, 0, 780);
        },
        hit() {
          hiss(0.16, 0.28, 0, "lowpass", 1100, 220, 1);
          blip(190, 0.18, "sine", 0.22, 0, 70);
          hiss(0.06, 0.1, 0, "bandpass", 2800, 900, 2);
        },
        miss() {
          hiss(0.2, 0.2, 0, "lowpass", 520, 120, 1);
          blip(150, 0.26, "sine", 0.22, 0, 55);
          blip(330, 0.22, "sawtooth", 0.06, 0.02, 190);
        },
        score() {
          blip(680 + Math.min(score, 30) * 12, 0.07, "triangle", 0.06, 0);
        },
        click() {
          hiss(0.018, 0.24, 0, "highpass", 3800, 2400, 0.8, 0.001);
          blip(185, 0.085, "triangle", 0.2, 0, 95, 0.002);
          blip(1500, 0.02, "square", 0.04, 0, 1000, 0.001);
        },
        bigThrow() {
          hiss(0.7, 0.14, 0, "lowpass", 220, 900, 1);
          blip(70, 0.6, "sine", 0.16, 0, 130);
        },
        bigImpact() {
          hiss(0.9, 0.4, 0, "lowpass", 1600, 90, 1);
          blip(95, 0.75, "sine", 0.34, 0, 32);
          hiss(0.12, 0.26, 0, "bandpass", 3200, 1200, 1.5);
          blip(60, 0.5, "triangle", 0.16, 0.02, 40);
        },
        respawn() {
          blip(520, 0.12, "sine", 0.07, 0, 780);
        },
        grab() {
          blip(420, 0.06, "triangle", 0.07, 0, 700);
        },
        chomp(when) {
          hiss(0.07, 0.2, when, "bandpass", 1900, 700, 1.6);
          blip(150, 0.09, "sine", 0.13, when, 85);
        },
        gulp() {
          blip(220, 0.18, "sine", 0.14, 0, 90);
        },
        step(when) {
          hiss(0.05, 0.1, when, "lowpass", 420, 160, 1);
        },
        slider() {
          blip(1300, 0.025, "sine", 0.035, 0);
        },
      };

      /* ---------- input ---------- */

      let stageRect = stage.getBoundingClientRect();

      function refreshStageRect() {
        stageRect = stage.getBoundingClientRect();
        pops.style.left = stage.offsetLeft + "px";
        pops.style.top = stage.offsetTop + "px";
        pops.style.width = stage.offsetWidth + "px";
        pops.style.height = stage.offsetHeight + "px";
      }

      window.addEventListener("resize", refreshStageRect);
      window.addEventListener("pageshow", refreshStageRect);
      if (window.ResizeObserver) {
        new ResizeObserver(refreshStageRect).observe(stage);
      }
      if (document.fonts) document.fonts.ready.then(refreshStageRect);
      refreshStageRect();

      stage.addEventListener(
        "pointerdown",
        (e) => {
          if (e.button !== 0 || busy) return;
          const active = current === "girl" ? girlEl : boyEl;
          const hit = active.contains(e.target);
          toss(
            e.clientX - stageRect.left,
            e.clientY - stageRect.top,
            stageRect.width,
            stageRect.height,
            hit,
          );
        },
        { passive: true },
      );

      /* ---------- throw ---------- */

      function toss(x, y, w, h, hit) {
        sfx.throw();

        const sx = w * 0.5 + (Math.random() - 0.5) * 110;
        const sy = h + 60;

        const tomato = document.createElement("div");
        tomato.className = "tomato";
        tomato.style.left = sx + "px";
        tomato.style.top = sy + "px";
        ammo.appendChild(tomato);

        const apexX = sx + (x - sx) * 0.5;
        const apexY = Math.min(sy, y) - 120 - Math.random() * 50;

        const flight = tomato.animate(
          [
            { transform: "translate(-50%,-50%) rotate(-40deg) scale(.9)" },
            {
              transform: `translate(calc(-50% + ${apexX - sx}px), calc(-50% + ${apexY - sy}px)) rotate(170deg) scale(1.05)`,
              offset: 0.55,
            },
            {
              transform: `translate(calc(-50% + ${x - sx}px), calc(-50% + ${y - sy}px)) rotate(360deg) scale(.85)`,
            },
          ],
          { duration: FLIGHT_MS, easing: "linear", fill: "forwards" },
        );

        flight.onfinish = () => {
          tomato.remove();
          if (hit) impact(x, y);
          else miss(x, y);
        };

        followTrail(tomato, flight, sx, sy, apexX, apexY, x, y);
      }

      function followTrail(tomato, flight, sx, sy, apexX, apexY, x, y) {
        const apexDX = apexX - sx;
        const apexDY = apexY - sy;
        const endDX = x - sx;
        const endDY = y - sy;
        const started = performance.now();
        let last = 0;

        function step(now) {
          if (!tomato.isConnected) return;

          const t = flight.currentTime;
          if (t > FLIGHT_MS + 120 || now - started > FLIGHT_MS + 400) return;

          if (now - last > 40) {
            last = now;
            const k = Math.min(1, Math.max(0, (t || 0) / FLIGHT_MS));
            let dx, dy;
            if (k < 0.55) {
              const a = k / 0.55;
              dx = apexDX * a;
              dy = apexDY * a;
            } else {
              const a = (k - 0.55) / 0.45;
              dx = apexDX + (endDX - apexDX) * a;
              dy = apexDY + (endDY - apexDY) * a;
            }
            drop(
              sx + dx,
              sy + dy,
              2.5 + Math.random() * 4.5,
              260 + Math.random() * 160,
              (Math.random() * 2 - 1) * 8,
              10 + Math.random() * 16,
            );
          }
          requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }

      /* ---------- impact ---------- */

      function impact(x, y) {
        if (scoreUp(x, y)) return; // a special sequence took over this hit
        sfx.hit();
        sfx.score();
        if (snacking) return; // keep the snack animation free of splats
        splat(x, y);
        burst(x, y);
        shake();
      }

      function miss(x, y) {
        sfx.miss();
        splat(x, y);
        burst(x, y);
        shake();
        score = 0;
        hitsSinceBig = 0;
        snackHits = 0;
        combo = 0;
        comboAt = -1e9;
        scoreEl.textContent = "0";
        missScore();
      }

      function splat(x, y, size) {
        size = size || 152;

        const el = document.createElement("div");
        el.className = "splat";
        el.style.left = x + "px";
        el.style.top = y + "px";
        el.innerHTML = splatMark();
        splats.appendChild(el);

        const svg = el.firstElementChild;
        svg.style.width = size + "px";
        svg.style.height = size + "px";
        svg.style.left = -size / 2 + "px";
        svg.style.top = -size / 2 + "px";

        while (splats.children.length > 26) splats.firstElementChild.remove();

        const rot = Math.random() * 40 - 20;
        const sc = 0.85 + Math.random() * 0.45;
        const s = (v) => v.toFixed(2);

        svg.animate(
          [
            { transform: `scale(${s(sc * 0.25)}) rotate(0deg)`, opacity: 1 },
            {
              transform: `scale(${s(sc * 1.08)}) rotate(${rot}deg)`,
              opacity: 1,
              offset: 0.16,
            },
            {
              transform: `scale(${s(sc)}) rotate(${rot}deg)`,
              opacity: 1,
              offset: 0.62,
            },
            { transform: `scale(${s(sc)}) rotate(${rot}deg)`, opacity: 0 },
          ],
          { duration: 3000, easing: "ease-out" },
        ).onfinish = () => el.remove();
      }

      function splatMark() {
        const color = SPLAT_COLORS[(Math.random() * SPLAT_COLORS.length) | 0];
        const main = smoothBlob(
          blobPoints(11 + ((Math.random() * 5) | 0), 20, 11, 8),
        );
        const core = smoothBlob(
          blobPoints(9 + ((Math.random() * 4) | 0), 11, 6, 5),
        );

        const cx = ((Math.random() * 2 - 1) * 9).toFixed(1);
        const cy = ((Math.random() * 2 - 1) * 9).toFixed(1);

        let drops = "";
        const dropCount = 4 + ((Math.random() * 3) | 0);
        for (let i = 0; i < dropCount; i++) {
          const ang = Math.random() * Math.PI * 2;
          const dist = 28 + Math.random() * 20;
          const r = 2 + Math.random() * 4.5;
          const dx = Math.cos(ang) * dist;
          const dy = Math.sin(ang) * dist;
          const rot = (ang * 180) / Math.PI;
          drops += `<ellipse cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" rx="${(r * 1.6).toFixed(1)}" ry="${r.toFixed(1)}" transform="rotate(${rot.toFixed(0)} ${dx.toFixed(1)} ${dy.toFixed(1)})"/>`;
        }

        return `<svg viewBox="-64 -64 128 128">
      <g fill="${color}">
        <path d="${main}"/>
        ${drops}
      </g>
      <path d="${core}" fill="#f26a53" opacity=".35" transform="translate(${cx},${cy})"/>
    </svg>`;
      }

      function blobPoints(n, base, spike, jitter) {
        const pts = [];
        for (let i = 0; i < n; i++) {
          const ang = (i / n) * Math.PI * 2;
          const rad = base + (i % 2 ? spike : 0) + Math.random() * jitter;
          pts.push([Math.cos(ang) * rad, Math.sin(ang) * rad]);
        }
        return pts;
      }

      function smoothBlob(pts) {
        const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
        const n = pts.length;
        const start = mid(pts[0], pts[1]);
        let d = `M${start[0].toFixed(1)},${start[1].toFixed(1)}`;
        for (let i = 1; i <= n; i++) {
          const c = pts[i % n];
          const m = mid(c, pts[(i + 1) % n]);
          d += `Q${c[0].toFixed(1)},${c[1].toFixed(1)} ${m[0].toFixed(1)},${m[1].toFixed(1)}`;
        }
        return d + "Z";
      }

      function burst(x, y) {
        const n = 7 + ((Math.random() * 3) | 0);
        for (let i = 0; i < n; i++) {
          const ang = (i / n) * Math.PI * 2 + Math.random() * 0.5;
          const dist = 26 + Math.random() * 54;
          drop(
            x,
            y,
            4 + Math.random() * 7,
            380 + Math.random() * 260,
            Math.cos(ang) * dist,
            Math.sin(ang) * dist * 0.9 + 14,
          );
        }

        const ring = document.createElement("div");
        ring.className = "ring";
        ring.style.left = x + "px";
        ring.style.top = y + "px";
        juice.appendChild(ring);
        ring.animate(
          [
            { transform: "translate(-50%,-50%) scale(.25)", opacity: 0.65 },
            { transform: "translate(-50%,-50%) scale(1.5)", opacity: 0 },
          ],
          { duration: 360, easing: "ease-out" },
        ).onfinish = () => ring.remove();
      }

      function drop(x, y, size, life, dx, dy) {
        const d = document.createElement("div");
        d.className = "drop";
        d.style.width = size + "px";
        d.style.height = size + "px";
        d.style.left = x + "px";
        d.style.top = y + "px";
        juice.appendChild(d);

        while (juice.children.length > 90) juice.firstElementChild.remove();

        d.animate(
          [
            { transform: "translate(-50%,-50%) scale(1)", opacity: 0.95 },
            {
              transform: `translate(calc(-50% + ${dx.toFixed(1)}px), calc(-50% + ${dy.toFixed(1)}px)) scale(.2)`,
              opacity: 0,
            },
          ],
          { duration: life, easing: "ease-out" },
        ).onfinish = () => d.remove();
      }

      /* ---------- feedback ---------- */

      let bumpAnim = null;
      let missAnim = null;
      let flinchAnim = null;

      function bumpScore() {
        if (bumpAnim) bumpAnim.cancel();
        if (missAnim) missAnim.cancel();
        bumpAnim = scoreBox.animate(
          [
            { transform: "scale(1)" },
            { transform: "scale(1.1)", offset: 0.4 },
            { transform: "scale(1)" },
          ],
          { duration: 220, easing: "ease-out" },
        );
      }

      function missScore() {
        if (bumpAnim) bumpAnim.cancel();
        if (missAnim) missAnim.cancel();
        missAnim = scoreBox.animate(
          [
            { color: "#4b2b18", transform: "scale(1)" },
            { color: "#c0261b", transform: "scale(1.14)", offset: 0.2 },
            {
              color: "#c0261b",
              transform: "translateX(-7px) rotate(-2deg) scale(1)",
              offset: 0.4,
            },
            {
              color: "#c0261b",
              transform: "translateX(7px) rotate(2deg) scale(1)",
              offset: 0.6,
            },
            {
              color: "#c0261b",
              transform: "translateX(-3px) rotate(0deg) scale(1)",
              offset: 0.8,
            },
            { color: "#4b2b18", transform: "translateX(0) rotate(0deg) scale(1)" },
          ],
          { duration: 450, easing: "ease-out" },
        );
      }

      function flinch() {
        if (flinchAnim) flinchAnim.cancel();
        flinchAnim = charWrap.animate(
          [
            { transform: "translateX(-50%) translate(0,0) rotate(0) scale(1)" },
            {
              transform:
                "translateX(-50%) translate(-8px,2px) rotate(-2.2deg) scale(1.02,.985)",
              offset: 0.15,
            },
            {
              transform:
                "translateX(-50%) translate(7px,-2px) rotate(1.8deg) scale(.985,1.02)",
              offset: 0.4,
            },
            {
              transform: "translateX(-50%) translate(-4px,1px) rotate(-1deg)",
              offset: 0.65,
            },
            { transform: "translateX(-50%) translate(0,0) rotate(0) scale(1)" },
          ],
          { duration: 320, easing: "ease-out" },
        );
      }

      function scoreUp(x, y) {
        score++;
        scoreEl.textContent = score;

        bumpScore();

        const now = performance.now();
        combo = now - comboAt < 900 ? combo + 1 : 1;
        comboAt = now;

        const pop = document.createElement("div");
        pop.className = "pop";
        pop.textContent = "+" + combo;
        pop.style.left = x + "px";
        pop.style.top = y + "px";
        pop.style.fontSize = Math.min(76, 34 + (combo - 1) * 3) + "px";
        pops.appendChild(pop);
        while (pops.children.length > 24) pops.firstElementChild.remove();

        pop.animate(
          [
            {
              transform: "translate(-50%,-50%) scale(.5)",
              opacity: 0,
              easing: "cubic-bezier(.2,.9,.3,1)",
            },
            {
              transform: "translate(-50%,-85%) scale(1.1)",
              opacity: 1,
              offset: 0.14,
            },
            {
              transform: "translate(-50%,-135%) scale(1)",
              opacity: 1,
              offset: 0.55,
            },
            { transform: "translate(-50%,-250%) scale(.95)", opacity: 0 },
          ],
          { duration: 900, easing: "linear" },
        ).onfinish = () => pop.remove();

        flinch();

        hitsSinceBig++;
        if (atHardest()) snackHits++;

        if (!busy && hitsSinceBig >= bigThreshold) {
          hitsSinceBig = 0;
          bigThreshold = 100 + ((Math.random() * 201) | 0);
          snackHits = 0;
          busy = true;
          setTimeout(bigThrow, 240);
          return true;
        }

        if (!busy && atHardest() && snackHits >= snackThreshold) {
          snackHits = 0;
          snackThreshold = 100 + ((Math.random() * 201) | 0);
          busy = true;
          snacking = true;
          setTimeout(() => snackTime(x, y), 150);
          return true;
        }

        return false;
      }

      let shakeAnim = null;

      function shake(big) {
        const ramp = Math.min(30, 2.5 * Math.pow(1.045, score));
        const amp = big ? Math.max(38, ramp * 1.6) : ramp;
        const tilt = Math.min(3, amp * 0.09);
        const n = (v) => v.toFixed(1);

        if (shakeAnim) shakeAnim.cancel();
        shakeAnim = stage.animate(
          [
            { transform: "translate(0,0) rotate(0deg)" },
            {
              transform: `translate(${n(-amp)}px, ${n(amp * 0.62)}px) rotate(${n(-tilt)}deg)`,
              offset: 0.25,
            },
            {
              transform: `translate(${n(amp * 0.85)}px, ${n(-amp * 0.5)}px) rotate(${n(tilt)}deg)`,
              offset: 0.55,
            },
            {
              transform: `translate(${n(-amp * 0.45)}px, ${n(amp * 0.25)}px) rotate(${n(-tilt * 0.4)}deg)`,
              offset: 0.8,
            },
            { transform: "translate(0,0) rotate(0deg)" },
          ],
          { duration: big ? 620 : 150 + amp * 8, easing: "ease-out" },
        );
      }

      /* ---------- big tomato ---------- */

      function bigThrow() {
        busy = true;
        sfx.bigThrow();

        const cx = stageRect.width / 2;
        const cy = stageRect.height * 0.38;

        const big = document.createElement("div");
        big.className = "tomato big";
        big.style.left = cx + "px";
        big.style.top = cy + "px";
        ammo.appendChild(big);

        const flight = big.animate(
          [
            {
              transform:
                "translate(-50%,-50%) translate(0,72vh) scale(.3) rotate(-30deg)",
              opacity: 1,
            },
            {
              transform:
                "translate(-50%,-50%) translate(0,0) scale(3.4) rotate(35deg)",
              opacity: 1,
              offset: 0.45,
            },
            {
              transform:
                "translate(-50%,-50%) translate(0,0) scale(4) rotate(55deg)",
              opacity: 1,
              offset: 0.62,
            },
            {
              transform:
                "translate(-50%,-50%) translate(0,0) scale(17) rotate(95deg)",
              opacity: 1,
            },
          ],
          {
            duration: 900,
            easing: "cubic-bezier(.3,.1,.55,1)",
            fill: "forwards",
          },
        );

        flight.onfinish = () => {
          big.remove();
          bigImpact(cx, cy);
        };
      }

      function bigImpact(x, y) {
        sfx.bigImpact();
        flashScreen();
        shake(true);
        splat(x, y, 1400);

        for (let i = 0; i < 30; i++) {
          const ang = Math.random() * Math.PI * 2;
          const dist = 90 + Math.random() * 240;
          drop(
            x,
            y,
            8 + Math.random() * 16,
            600 + Math.random() * 500,
            Math.cos(ang) * dist,
            Math.sin(ang) * dist + 40,
          );
        }

        if (flinchAnim) flinchAnim.cancel();
        charWrap.classList.add("blasted");

        setTimeout(() => {
          charWrap.classList.remove("blasted");
          charWrap.classList.add("respawn");
          sfx.respawn();
          setTimeout(() => {
            charWrap.classList.remove("respawn");
            busy = false;
          }, 520);
        }, 780);
      }

      function flashScreen() {
        flashEl.animate(
          [
            { opacity: 0 },
            { opacity: 0.85, offset: 0.12 },
            { opacity: 0.35, offset: 0.5 },
            { opacity: 0 },
          ],
          { duration: 520, easing: "ease-out" },
        );
      }

      /* ---------- snack (hardest difficulty only) ---------- */

      function atHardest() {
        return Number(skinSlider.value) === 0;
      }

      function snackTime(x, y) {
        const eat = Math.random() < 0.5;
        const svg = current === "girl" ? girlEl : boyEl;

        splats.replaceChildren(); // clear old splats so they don't cover the animation

        const cr = charWrap.getBoundingClientRect();
        const sr = stage.getBoundingClientRect();
        const hyFrac = eat ? 0.305 : 0.44;
        const hx = cr.width / 2;
        const hy = cr.height * hyFrac;

        const held = document.createElement("div");
        held.className = "tomato held";
        held.style.top = (hyFrac * 100).toFixed(1) + "%";
        charWrap.appendChild(held);

        const dx0 = sr.left + x - (cr.left + hx);
        const dy0 = sr.top + y - (cr.top + hy);

        held.animate(
          [
            {
              transform: `translate(calc(-50% + ${dx0.toFixed(1)}px), calc(-50% + ${dy0.toFixed(1)}px)) scale(1) rotate(0deg)`,
              opacity: 1,
            },
            {
              transform: "translate(-50%,-50%) scale(1.06) rotate(-10deg)",
              opacity: 1,
              offset: 0.55,
            },
            {
              transform: "translate(-50%,-50%) scale(1) rotate(0deg)",
              opacity: 1,
            },
          ],
          { duration: 300, easing: "cubic-bezier(.2,.8,.4,1)" },
        );

        svg.style.animationPlayState = "paused";
        if (flinchAnim) flinchAnim.cancel();
        sfx.grab();

        let mouth = null;

        const cleanup = () => {
          held.remove();
          if (mouth) mouth.remove();
          svg.style.animationPlayState = "";
          busy = false;
          snacking = false;
        };

        if (eat) {
          mouth = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "ellipse",
          );
          mouth.setAttribute("cx", 120);
          mouth.setAttribute("cy", 127);
          mouth.setAttribute("rx", 9.5);
          mouth.setAttribute("ry", 9);
          mouth.setAttribute("fill", "#6b241c");
          mouth.style.transformBox = "fill-box";
          mouth.style.transformOrigin = "50% 50%";
          svg.appendChild(mouth);

          mouth.animate(
            [
              { transform: "scaleY(.05)" },
              { transform: "scaleY(1)", offset: 0.18 },
              { transform: "scaleY(.05)", offset: 0.34 },
              { transform: "scaleY(1)", offset: 0.52 },
              { transform: "scaleY(.05)", offset: 0.68 },
              { transform: "scaleY(1)", offset: 0.82 },
              { transform: "scaleY(.05)" },
            ],
            { duration: 1300, delay: 300, easing: "ease-in-out", fill: "both" },
          );

          held.animate(
            [
              {
                transform: "translate(-50%,-50%) scale(1) rotate(0deg)",
                opacity: 1,
              },
              {
                transform: "translate(-50%,-50%) scale(.72) rotate(-7deg)",
                opacity: 1,
                offset: 0.24,
              },
              {
                transform: "translate(-50%,-50%) scale(.72) rotate(-7deg)",
                opacity: 1,
                offset: 0.34,
              },
              {
                transform: "translate(-50%,-50%) scale(.46) rotate(8deg)",
                opacity: 1,
                offset: 0.52,
              },
              {
                transform: "translate(-50%,-50%) scale(.46) rotate(8deg)",
                opacity: 1,
                offset: 0.62,
              },
              {
                transform: "translate(-50%,-50%) scale(.2) rotate(-10deg)",
                opacity: 1,
                offset: 0.78,
              },
              {
                transform: "translate(-50%,-50%) scale(.05) rotate(0deg)",
                opacity: 0,
                offset: 0.92,
              },
              {
                transform: "translate(-50%,-50%) scale(.05) rotate(0deg)",
                opacity: 0,
              },
            ],
            {
              duration: 1250,
              delay: 300,
              easing: "ease-in-out",
              fill: "forwards",
            },
          );

          const mxs = cr.left - sr.left + hx;
          const mys = cr.top - sr.top + hy;

          [620, 930, 1240].forEach((t) => {
            setTimeout(() => {
              for (let i = 0; i < 3; i++) {
                drop(
                  mxs,
                  mys,
                  3 + Math.random() * 4,
                  420 + Math.random() * 220,
                  (Math.random() * 2 - 1) * 26,
                  28 + Math.random() * 38,
                );
              }
            }, t);
          });

          charWrap.animate(
            [
              {
                transform: "translateX(-50%) translate(0,0) rotate(0) scale(1)",
              },
              {
                transform:
                  "translateX(-50%) translate(0,-8px) rotate(-1.6deg) scale(1.015)",
                offset: 0.1,
              },
              {
                transform: "translateX(-50%) translate(0,0) rotate(0) scale(1)",
                offset: 0.2,
              },
              {
                transform: "translateX(-50%) translate(0,-5px) rotate(1.3deg)",
                offset: 0.34,
              },
              {
                transform: "translateX(-50%) translate(0,0) rotate(0)",
                offset: 0.46,
              },
              {
                transform: "translateX(-50%) translate(0,-5px) rotate(-1.3deg)",
                offset: 0.6,
              },
              {
                transform: "translateX(-50%) translate(0,0) rotate(0)",
                offset: 0.72,
              },
              {
                transform: "translateX(-50%) translate(0,-4px) rotate(1deg)",
                offset: 0.84,
              },
              {
                transform: "translateX(-50%) translate(0,0) rotate(0)",
                offset: 0.94,
              },
              { transform: "translateX(-50%) translate(0,0) rotate(0)" },
            ],
            { duration: 1900, easing: "ease-in-out" },
          );

          [0.6, 0.95, 1.28].forEach((t) =>
            setTimeout(() => sfx.chomp(0), t * 1000),
          );
          setTimeout(() => sfx.gulp(), 1580);
          setTimeout(cleanup, 1900);
        } else {
          held.animate(
            [
              { opacity: 1 },
              { opacity: 1, offset: 0.55 },
              { opacity: 0, offset: 0.63 },
              { opacity: 0 },
            ],
            { duration: 2100, easing: "linear", fill: "forwards" },
          );

          charWrap.animate(
            [
              { transform: "translateX(-50%) translate(0,0) rotate(0)" },
              {
                transform:
                  "translateX(-50%) translate(10px,0) rotate(5deg) scale(1.05,.95)",
                offset: 0.06,
              },
              {
                transform:
                  "translateX(-50%) translate(-8px,-14px) rotate(-6deg)",
                offset: 0.12,
              },
              {
                transform:
                  "translateX(-50%) translate(18vw,-30px) rotate(8deg)",
                offset: 0.26,
              },
              {
                transform: "translateX(-50%) translate(32vw,4px) rotate(11deg)",
                offset: 0.36,
              },
              {
                transform:
                  "translateX(-50%) translate(48vw,-30px) rotate(13deg)",
                offset: 0.46,
              },
              {
                transform: "translateX(-50%) translate(62vw,0) rotate(15deg)",
                offset: 0.56,
              },
              {
                transform: "translateX(-50%) translate(62vw,0) rotate(15deg)",
                offset: 0.66,
              },
              {
                transform:
                  "translateX(-50%) translate(44vw,-26px) rotate(6deg)",
                offset: 0.78,
              },
              {
                transform: "translateX(-50%) translate(28vw,2px) rotate(2deg)",
                offset: 0.86,
              },
              {
                transform:
                  "translateX(-50%) translate(10vw,-16px) rotate(-3deg)",
                offset: 0.94,
              },
              { transform: "translateX(-50%) translate(0,0) rotate(0)" },
            ],
            { duration: 2100, easing: "ease-in-out" },
          );

          [0.1, 0.2, 0.3, 0.4, 1.6, 1.72, 1.84].forEach((t) =>
            setTimeout(() => sfx.step(0), t * 1000),
          );
          setTimeout(cleanup, 2100);
        }
      }

      /* ---------- character switch ---------- */

      document.querySelectorAll(".seg-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const key = btn.dataset.char;
          if (key === current) return;
          current = key;
          sfx.click();

          girlEl.classList.toggle("active", key === "girl");
          boyEl.classList.toggle("active", key === "boy");

          document.querySelectorAll(".seg-btn").forEach((b) => {
            const on = b === btn;
            b.classList.toggle("active", on);
            b.setAttribute("aria-pressed", String(on));
          });

          const el = key === "girl" ? girlEl : boyEl;
          el.classList.remove("switching");
          void el.getBoundingClientRect();
          el.classList.add("switching");
        });
      });

      [girlEl, boyEl].forEach((el) => {
        el.addEventListener("animationend", (e) => {
          if (e.animationName === "popIn") el.classList.remove("switching");
        });
      });

      /* ---------- reset ---------- */

      resetBtn.addEventListener("click", () => {
        sfx.click();
        score = 0;
        scoreEl.textContent = "0";
        hitsSinceBig = 0;
        bigThreshold = 100 + ((Math.random() * 201) | 0);
        snackHits = 0;
        snackThreshold = 10;
        combo = 0;
        comboAt = -1e9;

        splats.replaceChildren();
        juice.replaceChildren();
        pops.replaceChildren();
        ammo.replaceChildren();

        bumpScore();
      });

      /* ---------- skin tone ---------- */

      const SKIN_DARK = [51, 32, 26];
      const SKIN_MID = [138, 85, 53];
      const SKIN_LIGHT = [255, 224, 200];

      function applySkin(value) {
        const t = value / 100;
        const lerp = (a, b, k) =>
          a.map((v, i) => Math.round(v + (b[i] - v) * k));
        const base =
          t < 0.5
            ? lerp(SKIN_DARK, SKIN_MID, t * 2)
            : lerp(SKIN_MID, SKIN_LIGHT, (t - 0.5) * 2);
        const shade = lerp(base, [107, 60, 40], 0.22);
        const line = lerp(base, [90, 50, 34], 0.45);
        const rgb = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;
        const root = document.documentElement.style;

        root.setProperty("--skin", rgb(base));
        root.setProperty("--skin-shade", rgb(shade));
        root.setProperty("--skin-line", rgb(line));
      }

      const SKIN_KEY = "tomatoToss.skin";

      function savedSkinValue() {
        try {
          const raw = localStorage.getItem(SKIN_KEY);
          if (raw === null) return null;
          const v = Number(raw);
          return Number.isFinite(v)
            ? Math.min(100, Math.max(0, Math.round(v)))
            : null;
        } catch {
          return null;
        }
      }

      function restoreSkin() {
        const saved = savedSkinValue();
        if (saved !== null) skinSlider.value = String(saved);
        applySkin(skinSlider.value);
      }

      let lastTick = 0;
      skinSlider.addEventListener("input", (e) => {
        applySkin(e.target.value);
        try {
          localStorage.setItem(SKIN_KEY, e.target.value);
        } catch {}
        const now = performance.now();
        if (now - lastTick > 70) {
          lastTick = now;
          sfx.slider();
        }
      });

      restoreSkin();
      window.addEventListener("pageshow", restoreSkin);

      /* ---------- sound toggle ---------- */

      const soundBtn = document.getElementById("sound");

      soundBtn.addEventListener("click", () => {
        if (!muted) sfx.click(); // click before muting so it is still audible
        muted = !muted;
        if (!muted) sfx.click(); // and again right after unmuting
        soundBtn.classList.toggle("off", muted);
        soundBtn.textContent = muted ? "🔇" : "🔊";
        soundBtn.setAttribute("aria-pressed", String(!muted));
        soundBtn.setAttribute("aria-label", muted ? "Sound off" : "Sound on");
      });
    </script>
  </body>
</html>
