<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🍅 Tomato Toss</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;
    font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(circle at 50% -10%,#fffdf6 0%,#fdf3dd 38%,#f6e2bd 72%,#eed0a1 100%);
    display:flex;flex-direction:column;
    user-select:none;-webkit-user-select:none;
  }

  header{
    flex:0 0 auto;padding:16px 16px 6px;
    display:flex;flex-direction:column;align-items:center;gap:12px;
  }

  #scorebox{
    display:inline-flex;align-items:center;gap:10px;
    padding:8px 26px 8px 18px;border-radius:999px;
    background:rgba(255,255,255,.75);
    border:2px solid #fff;
    box-shadow:0 10px 26px rgba(150,100,50,.18),inset 0 -3px 0 rgba(200,150,90,.14);
    color:#4b2b18;font-weight:800;font-size:38px;line-height:1;
    font-variant-numeric:tabular-nums;
  }
  #scorebox .icon{font-size:27px;filter:drop-shadow(0 2px 2px rgba(160,40,30,.25))}
  #scorebox.bump{animation:bump .22s ease-out}
  @keyframes bump{
    0%{transform:scale(1)}
    40%{transform:scale(1.1)}
    100%{transform:scale(1)}
  }
  #scorebox.miss{animation:miss .45s ease-out}
  @keyframes miss{
    0%{color:#4b2b18;transform:scale(1)}
    20%{color:#c0261b;transform:scale(1.14)}
    40%{color:#c0261b;transform:translateX(-7px) rotate(-2deg)}
    60%{color:#c0261b;transform:translateX(7px) rotate(2deg)}
    80%{transform:translateX(-3px)}
    100%{color:#4b2b18;transform:translateX(0)}
  }

  .controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px}

  .seg{
    display:flex;gap:2px;padding:4px;
    background:rgba(255,255,255,.6);
    border:2px solid #fff;border-radius:999px;
    box-shadow:0 6px 16px rgba(150,100,50,.13);
  }
  .seg-btn{
    font:inherit;font-weight:700;font-size:15px;
    color:#8a6a4c;background:transparent;border:0;cursor:pointer;
    padding:7px 20px;border-radius:999px;
    transition:background .15s,color .15s,transform .1s,box-shadow .15s;
  }
  .seg-btn:hover{color:#4b2b18}
  .seg-btn.active{
    background:#e8382a;color:#fff;
    box-shadow:0 3px 9px rgba(200,50,40,.35);
  }
  .seg-btn:active{transform:scale(.96)}

  #reset{
    font:inherit;font-weight:700;font-size:15px;
    color:#8a6a4c;cursor:pointer;
    background:rgba(255,255,255,.6);
    border:2px solid #fff;border-radius:999px;
    padding:9px 20px;
    box-shadow:0 6px 16px rgba(150,100,50,.13);
    transition:transform .1s,color .15s,background .15s;
  }
  #reset:hover{color:#b5281d;background:#fff}
  #reset:active{transform:scale(.96)}

  .skin{
    display:flex;align-items:center;gap:9px;
    padding:9px 14px;border-radius:999px;
    background:rgba(255,255,255,.6);
    border:2px solid #fff;
    box-shadow:0 6px 16px rgba(150,100,50,.13);
  }
  .skin-tag{
    font-size:11px;font-weight:800;letter-spacing:.04em;
    color:#a8835c;white-space:nowrap;user-select:none;
  }
  .skin-tag.hard{color:#8a3f22}
  .skin input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:140px;height:10px;border-radius:999px;outline:none;cursor:pointer;
    background:linear-gradient(90deg,#33201a 0%,#8a5535 50%,#ffe0c8 100%);
  }
  .skin input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:20px;height:20px;border-radius:50%;background:#fff;
    border:3px solid #8a6a4c;box-shadow:0 2px 6px rgba(90,60,30,.3);
  }
  .skin input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;background:#fff;
    border:3px solid #8a6a4c;box-shadow:0 2px 6px rgba(90,60,30,.3);
  }

  #girl .skin,#boy .skin{fill:var(--skin,#f7cdad)}
  #girl .skin-shade,#boy .skin-shade{fill:var(--skin-shade,#eab894)}
  #girl .skin-line,#boy .skin-line{stroke:var(--skin-line,#e0a683)}

  #stage{
    position:relative;flex:1 1 auto;min-height:0;width:100%;max-width:700px;
    margin:0 auto;touch-action:none;cursor:crosshair;
  }

  #shadow{
    position:absolute;left:50%;bottom:1.5%;width:clamp(120px,24vh,170px);height:24px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at center,rgba(120,80,40,.22),rgba(120,80,40,0) 70%);
  }

  .char{
    position:absolute;left:50%;bottom:4%;
    width:clamp(170px,42vh,300px);
    transform:translateX(-50%);
    transform-origin:50% 92%;
    pointer-events:none;
  }
  #girl *, #boy *{pointer-events:auto}
  .char.hit{animation:flinch .32s ease-out}
  @keyframes flinch{
    0%{transform:translateX(-50%) translate(0,0) rotate(0) scale(1)}
    15%{transform:translateX(-50%) translate(-8px,2px) rotate(-2.2deg) scale(1.02,.985)}
    40%{transform:translateX(-50%) translate(7px,-2px) rotate(1.8deg) scale(.985,1.02)}
    65%{transform:translateX(-50%) translate(-4px,1px) rotate(-1deg)}
    100%{transform:translateX(-50%) translate(0,0) rotate(0) scale(1)}
  }
  .char.blasted{animation:blast .7s cubic-bezier(.35,.05,.6,1) forwards}
  @keyframes blast{
    0%{transform:translateX(-50%) translate(0,0) rotate(0) scale(1);opacity:1}
    100%{transform:translateX(-50%) translate(42vw,-110vh) rotate(200deg) scale(.35);opacity:0}
  }
  .char.respawn{animation:respawn .5s ease-out}
  @keyframes respawn{
    0%{transform:translateX(-50%) translateY(50px) scale(.86);opacity:0}
    55%{transform:translateX(-50%) translateY(-8px) scale(1.03);opacity:1}
    100%{transform:translateX(-50%) translateY(0) scale(1);opacity:1}
  }

  #girl,#boy{
    display:none;width:100%;height:auto;overflow:visible;
    transform-origin:50% 92%;
    animation:idle 3s ease-in-out infinite;
    filter:drop-shadow(0 14px 18px rgba(120,80,40,.16));
  }
  #girl.active,#boy.active{display:block}
  #girl.switching,#boy.switching{animation:popIn .3s ease-out}
  @keyframes idle{
    0%,100%{transform:translateY(0) rotate(-1deg)}
    50%{transform:translateY(-7px) rotate(1deg)}
  }
  @keyframes popIn{
    0%{transform:scale(.9)}
    60%{transform:scale(1.04)}
    100%{transform:scale(1)}
  }

  #fx,#splats,#juice,#pops,#ammo{position:absolute;inset:0;pointer-events:none}
  #ammo{overflow:visible}

  .tomato{
    position:absolute;width:42px;height:39px;border-radius:50% 50% 47% 47%;
    background:radial-gradient(circle at 34% 28%,#ff7a63 0%,#e8382a 45%,#a9180f 100%);
    box-shadow:inset -4px -5px 10px rgba(0,0,0,.28),0 4px 10px rgba(140,40,30,.25);
    transform:translate(-50%,-50%);pointer-events:none;
  }
  .tomato::before{
    content:"";position:absolute;top:-8px;left:50%;width:24px;height:19px;
    transform:translateX(-50%);
    background:#3f9142;
    clip-path:polygon(50% 55%,82% 92%,68% 50%,100% 30%,60% 35%,50% 0%,40% 35%,0 30%,32% 50%,18% 92%);
  }
  .tomato::after{
    content:"";position:absolute;top:-13px;left:50%;width:6px;height:10px;border-radius:3px;
    transform:translateX(-50%) rotate(6deg);background:#2f7032;
  }

  .tomato.big{
    width:130px;height:120px;
    box-shadow:inset -14px -18px 40px rgba(0,0,0,.3),0 20px 60px rgba(140,40,30,.35);
  }
  .tomato.big::before{top:-24px;width:76px;height:60px}
  .tomato.big::after{top:-40px;width:18px;height:30px;border-radius:9px}

  .tomato.held{left:50%;top:30.5%;z-index:3}

  #flash{
    position:fixed;inset:0;z-index:60;pointer-events:none;
    background:radial-gradient(circle at 50% 45%,#f25a45,#d0271a 70%);
    opacity:0;
  }

  .drop{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#f0543f,#c62b1f 70%,#a3180f);
    box-shadow:0 1px 2px rgba(120,20,10,.25);
    transform:translate(-50%,-50%);
    will-change:transform,opacity;
  }

  .ring{
    position:absolute;width:54px;height:54px;border-radius:50%;
    border:3px solid rgba(214,52,38,.45);
    transform:translate(-50%,-50%);
  }

  .splat{position:absolute;width:0;height:0}
  .splat svg{position:absolute;left:-76px;top:-76px;width:152px;height:152px;overflow:visible}

  .pop{
    position:absolute;transform:translate(-50%,-50%);
    font-size:24px;font-weight:900;color:#fff;letter-spacing:.5px;
    text-shadow:0 2px 0 #b5281d,0 0 12px rgba(180,40,30,.55);
  }
</style>
</head>
<body>

  <header>
    <div id="scorebox"><span class="icon">🍅</span><span id="score">0</span></div>

    <div class="controls">
      <div class="seg" role="group" aria-label="Choose a character">
        <button type="button" class="seg-btn active" data-char="girl" aria-pressed="true">Girl</button>
        <button type="button" class="seg-btn" data-char="boy" aria-pressed="false">Boy</button>
      </div>
      <button type="button" id="reset">Reset</button>
      <label class="skin">
        <span class="skin-tag" aria-hidden="true">Easy</span>
        <input id="skin-tone" type="range" min="0" max="100" value="94" step="1" aria-label="Difficulty">
        <span class="skin-tag hard" aria-hidden="true">Hardest</span>
      </label>
    </div>
  </header>

  <main id="stage">
    <div id="shadow"></div>

    <div class="char">
      <svg id="girl" class="active" viewBox="0 0 240 400" aria-hidden="true">
        <!-- back hair -->
        <ellipse cx="120" cy="104" rx="50" ry="54" fill="#6f4429"/>

        <!-- legs -->
        <rect x="101" y="256" width="16" height="80" rx="8" fill="#5b6b86"/>
        <rect x="123" y="256" width="16" height="80" rx="8" fill="#5b6b86"/>

        <!-- shoes -->
        <ellipse cx="105" cy="340" rx="20" ry="10" fill="#2c3543"/>
        <ellipse cx="135" cy="340" rx="20" ry="10" fill="#2c3543"/>

        <!-- dress -->
        <path d="M97 154 q23 -14 46 0 l17 112 q-40 12 -80 0 z" fill="#e2647f"/>
        <path d="M120 160 v106 q-19 -2 -34 -8 l-6 -104 q19 -8 40 6 z" fill="#d25570" opacity=".55"/>

        <!-- arms -->
        <rect x="82" y="158" width="14" height="86" rx="7" class="skin" fill="#f7cdad" transform="rotate(8 89 201)"/>
        <rect x="144" y="158" width="14" height="86" rx="7" class="skin" fill="#f7cdad" transform="rotate(-8 151 201)"/>
        <ellipse cx="83" cy="244" rx="8.5" ry="9.5" class="skin" fill="#f7cdad"/>
        <ellipse cx="157" cy="244" rx="8.5" ry="9.5" class="skin" fill="#f7cdad"/>

        <!-- neck -->
        <path d="M109 122 h22 v24 q-11 8 -22 0 z" class="skin-shade" fill="#eab894"/>

        <!-- face -->
        <ellipse cx="120" cy="100" rx="39" ry="41" class="skin" fill="#f7cdad"/>

        <!-- fringe -->
        <path d="M82 102 C82 64 99 50 120 50 C141 50 158 64 158 102 C152 84 142 74 130 78 C116 83 100 76 92 86 C87 92 84 96 82 102 Z" fill="#6f4429"/>

        <!-- brows -->
        <path d="M97 93 q8 -5 16 -1" stroke="#6f4429" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M127 92 q8 -3 16 2" stroke="#6f4429" stroke-width="2.5" fill="none" stroke-linecap="round"/>

        <!-- eyes -->
        <ellipse cx="105" cy="103" rx="4" ry="5" fill="#2b2118"/>
        <ellipse cx="135" cy="103" rx="4" ry="5" fill="#2b2118"/>
        <circle cx="106.5" cy="101" r="1.4" fill="#fff" opacity=".9"/>
        <circle cx="136.5" cy="101" r="1.4" fill="#fff" opacity=".9"/>

        <!-- nose -->
        <path d="M120 106 q2 4 0 6" class="skin-line" stroke="#e0a683" stroke-width="2" fill="none" stroke-linecap="round"/>

        <!-- mouth -->
        <path d="M111 122 q9 9 18 0" stroke="#c4705c" stroke-width="2.6" fill="none" stroke-linecap="round"/>

        <!-- blush -->
        <ellipse cx="96" cy="114" rx="7" ry="5" fill="#f39c9c" opacity=".5"/>
        <ellipse cx="144" cy="114" rx="7" ry="5" fill="#f39c9c" opacity=".5"/>
      </svg>

      <svg id="boy" viewBox="0 0 240 400" aria-hidden="true">
        <!-- hair back cap -->
        <path d="M75 108 C75 60 95 44 120 44 C145 44 165 60 165 108 C160 92 150 78 138 74 C124 86 106 84 96 74 C86 80 80 94 75 108 Z" fill="#4a2f1d"/>

        <!-- legs -->
        <rect x="100" y="260" width="16" height="76" rx="8" class="skin" fill="#f7cdad"/>
        <rect x="124" y="260" width="16" height="76" rx="8" class="skin" fill="#f7cdad"/>

        <!-- socks -->
        <rect x="100" y="314" width="16" height="20" rx="7" fill="#f6f1e7"/>
        <rect x="124" y="314" width="16" height="20" rx="7" fill="#f6f1e7"/>

        <!-- shorts -->
        <path d="M94 234 h52 v42 h-21 l-5 -22 l-5 22 h-21 z" fill="#3f5573"/>

        <!-- sneakers -->
        <ellipse cx="103" cy="339" rx="21" ry="10" fill="#2c3543"/>
        <ellipse cx="137" cy="339" rx="21" ry="10" fill="#2c3543"/>
        <ellipse cx="103" cy="333" rx="12" ry="3.5" fill="#fff" opacity=".85"/>
        <ellipse cx="137" cy="333" rx="12" ry="3.5" fill="#fff" opacity=".85"/>

        <!-- shirt -->
        <path d="M99 152 q21 -12 42 0 l7 92 q-28 9 -56 0 z" fill="#3fa08f"/>
        <path d="M105 150 q15 12 30 0 l2 8 q-17 10 -34 0 z" fill="#368a7e"/>

        <!-- sleeves -->
        <rect x="80" y="155" width="18" height="30" rx="9" fill="#3fa08f" transform="rotate(7 89 170)"/>
        <rect x="142" y="155" width="18" height="30" rx="9" fill="#3fa08f" transform="rotate(-7 151 170)"/>

        <!-- arms -->
        <rect x="79" y="176" width="14" height="64" rx="7" class="skin" fill="#f7cdad" transform="rotate(6 86 208)"/>
        <rect x="147" y="176" width="14" height="64" rx="7" class="skin" fill="#f7cdad" transform="rotate(-6 154 208)"/>
        <ellipse cx="82" cy="240" rx="8.5" ry="9.5" class="skin" fill="#f7cdad"/>
        <ellipse cx="158" cy="240" rx="8.5" ry="9.5" class="skin" fill="#f7cdad"/>

        <!-- neck -->
        <path d="M109 122 h22 v24 q-11 8 -22 0 z" class="skin-shade" fill="#eab894"/>

        <!-- face -->
        <ellipse cx="120" cy="100" rx="39" ry="41" class="skin" fill="#f7cdad"/>

        <!-- fringe -->
        <path d="M84 94 C84 62 100 48 120 48 C140 48 156 62 156 94 C149 82 138 74 126 78 C114 82 100 76 93 84 C88 88 86 90 84 94 Z" fill="#4a2f1d"/>

        <!-- brows -->
        <path d="M97 93 q8 -4 16 -1" stroke="#4a2f1d" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M127 92 q8 -3 16 2" stroke="#4a2f1d" stroke-width="3" fill="none" stroke-linecap="round"/>

        <!-- eyes -->
        <ellipse cx="105" cy="103" rx="4" ry="5" fill="#2b2118"/>
        <ellipse cx="135" cy="103" rx="4" ry="5" fill="#2b2118"/>
        <circle cx="106.5" cy="101" r="1.4" fill="#fff" opacity=".9"/>
        <circle cx="136.5" cy="101" r="1.4" fill="#fff" opacity=".9"/>

        <!-- nose -->
        <path d="M120 106 q2 4 0 6" class="skin-line" stroke="#e0a683" stroke-width="2" fill="none" stroke-linecap="round"/>

        <!-- mouth -->
        <path d="M112 123 q8 7 16 0" stroke="#c4705c" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <div id="fx">
      <div id="splats"></div>
      <div id="juice"></div>
      <div id="pops"></div>
    </div>

    <div id="ammo"></div>
  </main>

  <div id="flash"></div>

<script>
  const stage    = document.getElementById('stage');
  const ammo     = document.getElementById('ammo');
  const splats   = document.getElementById('splats');
  const juice    = document.getElementById('juice');
  const pops     = document.getElementById('pops');
  const scoreEl  = document.getElementById('score');
  const scoreBox = document.getElementById('scorebox');
  const resetBtn = document.getElementById('reset');
  const charWrap = document.querySelector('.char');
  const girlEl   = document.getElementById('girl');
  const boyEl    = document.getElementById('boy');
  const flashEl  = document.getElementById('flash');
  const skinSlider = document.getElementById('skin-tone');

  const SPLAT_COLORS = ['#c92c22', '#b5231b', '#d93a2b', '#bf2a20'];
  const FLIGHT_MS = 380;

  let score = 0;
  let current = 'girl';
  let busy = false;
  let hitsSinceBig = 0;
  let bigThreshold = 100 + ((Math.random() * 201) | 0);
  let snackHits = 0;
  let snackThreshold = 10;

  /* ---------- input ---------- */

  stage.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || busy) return;
    const r = stage.getBoundingClientRect();
    const active = current === 'girl' ? girlEl : boyEl;
    const hit = active.contains(e.target);
    toss(e.clientX - r.left, e.clientY - r.top, r.width, r.height, hit);
  });

  /* ---------- throw ---------- */

  function toss(x, y, w, h, hit) {
    const sx = w * 0.5 + (Math.random() - 0.5) * 110;
    const sy = h + 60;

    const tomato = document.createElement('div');
    tomato.className = 'tomato';
    tomato.style.left = sx + 'px';
    tomato.style.top  = sy + 'px';
    ammo.appendChild(tomato);

    const apexX = sx + (x - sx) * 0.5;
    const apexY = Math.min(sy, y) - 120 - Math.random() * 50;

    const flight = tomato.animate([
      { transform: 'translate(-50%,-50%) rotate(-40deg) scale(.9)' },
      { transform: `translate(calc(-50% + ${apexX - sx}px), calc(-50% + ${apexY - sy}px)) rotate(170deg) scale(1.05)`, offset: .55 },
      { transform: `translate(calc(-50% + ${x - sx}px), calc(-50% + ${y - sy}px)) rotate(360deg) scale(.85)` }
    ], { duration: FLIGHT_MS, easing: 'linear', fill: 'forwards' });

    flight.onfinish = () => {
      tomato.remove();
      if (hit) impact(x, y);
      else miss(x, y);
    };

    followTrail(tomato, flight);
  }

  function followTrail(tomato, flight) {
    const sr = stage.getBoundingClientRect();
    let last = 0;

    function step(now) {
      if (!tomato.isConnected || flight.playState !== 'running') return;

      if (now - last > 30) {
        last = now;
        const r = tomato.getBoundingClientRect();
        drop(
          r.left + r.width / 2 - sr.left,
          r.top + r.height / 2 - sr.top,
          2.5 + Math.random() * 4.5,
          260 + Math.random() * 160,
          (Math.random() * 2 - 1) * 8,
          10 + Math.random() * 16
        );
      }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  /* ---------- impact ---------- */

  function impact(x, y) {
    if (scoreUp(x, y)) return;   // a special sequence took over this hit
    splat(x, y);
    burst(x, y);
    shake();
  }

  function miss(x, y) {
    splat(x, y);
    burst(x, y);
    shake();
    score = 0;
    hitsSinceBig = 0;
    snackHits = 0;
    scoreEl.textContent = '0';
    scoreBox.classList.remove('bump', 'miss');
    void scoreBox.offsetWidth;
    scoreBox.classList.add('miss');
  }

  function splat(x, y, size) {
    size = size || 152;

    const el = document.createElement('div');
    el.className = 'splat';
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    el.innerHTML = splatMark();
    splats.appendChild(el);

    const svg = el.firstElementChild;
    svg.style.width  = size + 'px';
    svg.style.height = size + 'px';
    svg.style.left = (-size / 2) + 'px';
    svg.style.top  = (-size / 2) + 'px';

    while (splats.children.length > 34) splats.firstElementChild.remove();

    const rot = Math.random() * 40 - 20;
    const sc  = 0.85 + Math.random() * 0.45;
    const s   = (v) => v.toFixed(2);

    svg.animate([
      { transform: `scale(${s(sc * 0.25)}) rotate(0deg)`, opacity: 1 },
      { transform: `scale(${s(sc * 1.08)}) rotate(${rot}deg)`, opacity: 1, offset: .16 },
      { transform: `scale(${s(sc)}) rotate(${rot}deg)`, opacity: 1, offset: .62 },
      { transform: `scale(${s(sc)}) rotate(${rot}deg)`, opacity: 0 }
    ], { duration: 3000, easing: 'ease-out' }).onfinish = () => el.remove();
  }

  function splatMark() {
    const color = SPLAT_COLORS[(Math.random() * SPLAT_COLORS.length) | 0];
    const main  = smoothBlob(blobPoints(11 + ((Math.random() * 5) | 0), 20, 11, 8));
    const core  = smoothBlob(blobPoints(9 + ((Math.random() * 4) | 0), 11, 6, 5));

    const cx = ((Math.random() * 2 - 1) * 9).toFixed(1);
    const cy = ((Math.random() * 2 - 1) * 9).toFixed(1);

    let drops = '';
    const dropCount = 4 + ((Math.random() * 3) | 0);
    for (let i = 0; i < dropCount; i++) {
      const ang  = Math.random() * Math.PI * 2;
      const dist = 28 + Math.random() * 20;
      const r    = 2 + Math.random() * 4.5;
      const dx   = Math.cos(ang) * dist;
      const dy   = Math.sin(ang) * dist;
      const rot  = (ang * 180) / Math.PI;
      drops += `<ellipse cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" rx="${(r * 1.6).toFixed(1)}" ry="${r.toFixed(1)}" transform="rotate(${rot.toFixed(0)} ${dx.toFixed(1)} ${dy.toFixed(1)})"/>`;
    }

    return `<svg viewBox="-64 -64 128 128">
      <g fill="${color}">
        <path d="${main}"/>
        ${drops}
      </g>
      <path d="${core}" fill="#f26a53" opacity=".35" transform="translate(${cx},${cy})"/>
    </svg>`;
  }

  function blobPoints(n, base, spike, jitter) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2;
      const rad = base + (i % 2 ? spike : 0) + Math.random() * jitter;
      pts.push([Math.cos(ang) * rad, Math.sin(ang) * rad]);
    }
    return pts;
  }

  function smoothBlob(pts) {
    const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const n = pts.length;
    const start = mid(pts[0], pts[1]);
    let d = `M${start[0].toFixed(1)},${start[1].toFixed(1)}`;
    for (let i = 1; i <= n; i++) {
      const c = pts[i % n];
      const m = mid(c, pts[(i + 1) % n]);
      d += `Q${c[0].toFixed(1)},${c[1].toFixed(1)} ${m[0].toFixed(1)},${m[1].toFixed(1)}`;
    }
    return d + 'Z';
  }

  function burst(x, y) {
    const n = 9 + ((Math.random() * 5) | 0);
    for (let i = 0; i < n; i++) {
      const ang  = (i / n) * Math.PI * 2 + Math.random() * 0.5;
      const dist = 26 + Math.random() * 54;
      drop(
        x, y,
        4 + Math.random() * 7,
        380 + Math.random() * 260,
        Math.cos(ang) * dist,
        Math.sin(ang) * dist * 0.9 + 14
      );
    }

    const ring = document.createElement('div');
    ring.className = 'ring';
    ring.style.left = x + 'px';
    ring.style.top  = y + 'px';
    juice.appendChild(ring);
    ring.animate([
      { transform: 'translate(-50%,-50%) scale(.25)', opacity: .65 },
      { transform: 'translate(-50%,-50%) scale(1.5)', opacity: 0 }
    ], { duration: 360, easing: 'ease-out' }).onfinish = () => ring.remove();
  }

  function drop(x, y, size, life, dx, dy) {
    const d = document.createElement('div');
    d.className = 'drop';
    d.style.width  = size + 'px';
    d.style.height = size + 'px';
    d.style.left = x + 'px';
    d.style.top  = y + 'px';
    juice.appendChild(d);

    while (juice.children.length > 140) juice.firstElementChild.remove();

    d.animate([
      { transform: 'translate(-50%,-50%) scale(1)', opacity: .95 },
      { transform: `translate(calc(-50% + ${dx.toFixed(1)}px), calc(-50% + ${dy.toFixed(1)}px)) scale(.2)`, opacity: 0 }
    ], { duration: life, easing: 'ease-out' }).onfinish = () => d.remove();
  }

  /* ---------- feedback ---------- */

  function scoreUp(x, y) {
    score++;
    scoreEl.textContent = score;

    scoreBox.classList.remove('bump');
    void scoreBox.offsetWidth;
    scoreBox.classList.add('bump');

    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.textContent = '+1';
    pop.style.left = x + 'px';
    pop.style.top  = y + 'px';
    pops.appendChild(pop);

    pop.animate([
      { transform: 'translate(-50%,-50%) scale(.5)', opacity: 0 },
      { transform: 'translate(-50%,-100%) scale(1.1)', opacity: 1, offset: .25 },
      { transform: 'translate(-50%,-190%) scale(1)', opacity: 0 }
    ], { duration: 750, easing: 'ease-out' }).onfinish = () => pop.remove();

    charWrap.classList.remove('hit');
    void charWrap.offsetWidth;
    charWrap.classList.add('hit');

    hitsSinceBig++;
    if (atHardest()) snackHits++;

    if (!busy && hitsSinceBig >= bigThreshold) {
      hitsSinceBig = 0;
      bigThreshold = 100 + ((Math.random() * 201) | 0);
      snackHits = 0;
      busy = true;
      setTimeout(bigThrow, 240);
      return true;
    }

    if (!busy && atHardest() && snackHits >= snackThreshold) {
      snackHits = 0;
      snackThreshold = 100 + ((Math.random() * 201) | 0);
      busy = true;
      setTimeout(() => snackTime(x, y), 150);
      return true;
    }

    return false;
  }

  function shake(big) {
    const ramp = Math.min(30, 2.5 * Math.pow(1.045, score));
    const amp  = big ? Math.max(38, ramp * 1.6) : ramp;
    const tilt = Math.min(3, amp * 0.09);
    const n = (v) => v.toFixed(1);

    stage.animate([
      { transform: 'translate(0,0) rotate(0deg)' },
      { transform: `translate(${n(-amp)}px, ${n(amp * 0.62)}px) rotate(${n(-tilt)}deg)`, offset: .25 },
      { transform: `translate(${n(amp * 0.85)}px, ${n(-amp * 0.5)}px) rotate(${n(tilt)}deg)`, offset: .55 },
      { transform: `translate(${n(-amp * 0.45)}px, ${n(amp * 0.25)}px) rotate(${n(-tilt * 0.4)}deg)`, offset: .8 },
      { transform: 'translate(0,0) rotate(0deg)' }
    ], { duration: big ? 620 : 150 + amp * 8, easing: 'ease-out' });
  }

  charWrap.addEventListener('animationend', (e) => {
    if (e.animationName === 'flinch') charWrap.classList.remove('hit');
  });

  /* ---------- big tomato ---------- */

  function bigThrow() {
    busy = true;

    const r  = stage.getBoundingClientRect();
    const cx = r.width / 2;
    const cy = r.height * 0.38;

    const big = document.createElement('div');
    big.className = 'tomato big';
    big.style.left = cx + 'px';
    big.style.top  = cy + 'px';
    ammo.appendChild(big);

    const flight = big.animate([
      { transform: 'translate(-50%,-50%) translate(0,72vh) scale(.3) rotate(-30deg)', opacity: 1 },
      { transform: 'translate(-50%,-50%) translate(0,0) scale(3.4) rotate(35deg)', opacity: 1, offset: .45 },
      { transform: 'translate(-50%,-50%) translate(0,0) scale(4) rotate(55deg)', opacity: 1, offset: .62 },
      { transform: 'translate(-50%,-50%) translate(0,0) scale(17) rotate(95deg)', opacity: 1 }
    ], { duration: 900, easing: 'cubic-bezier(.3,.1,.55,1)', fill: 'forwards' });

    flight.onfinish = () => {
      big.remove();
      bigImpact(cx, cy);
    };
  }

  function bigImpact(x, y) {
    flashScreen();
    shake(true);
    splat(x, y, 1400);

    for (let i = 0; i < 30; i++) {
      const ang  = Math.random() * Math.PI * 2;
      const dist = 90 + Math.random() * 240;
      drop(x, y, 8 + Math.random() * 16, 600 + Math.random() * 500, Math.cos(ang) * dist, Math.sin(ang) * dist + 40);
    }

    charWrap.classList.remove('hit');
    charWrap.classList.add('blasted');

    setTimeout(() => {
      charWrap.classList.remove('blasted');
      charWrap.classList.add('respawn');
      setTimeout(() => {
        charWrap.classList.remove('respawn');
        busy = false;
      }, 520);
    }, 780);
  }

  function flashScreen() {
    flashEl.animate([
      { opacity: 0 },
      { opacity: .85, offset: .12 },
      { opacity: .35, offset: .5 },
      { opacity: 0 }
    ], { duration: 520, easing: 'ease-out' });
  }

  /* ---------- snack (hardest difficulty only) ---------- */

  function atHardest() {
    return Number(skinSlider.value) === 0;
  }

  function snackTime(x, y) {
    const eat = Math.random() < 0.5;
    const svg = current === 'girl' ? girlEl : boyEl;

    const cr = charWrap.getBoundingClientRect();
    const sr = stage.getBoundingClientRect();
    const hyFrac = eat ? 0.305 : 0.44;
    const hx = cr.width / 2;
    const hy = cr.height * hyFrac;

    const held = document.createElement('div');
    held.className = 'tomato held';
    held.style.top = (hyFrac * 100).toFixed(1) + '%';
    charWrap.appendChild(held);

    const dx0 = (sr.left + x) - (cr.left + hx);
    const dy0 = (sr.top + y) - (cr.top + hy);

    held.animate([
      { transform: `translate(calc(-50% + ${dx0.toFixed(1)}px), calc(-50% + ${dy0.toFixed(1)}px)) scale(1) rotate(0deg)`, opacity: 1 },
      { transform: 'translate(-50%,-50%) scale(1.06) rotate(-10deg)', opacity: 1, offset: .55 },
      { transform: 'translate(-50%,-50%) scale(1) rotate(0deg)', opacity: 1 }
    ], { duration: 300, easing: 'cubic-bezier(.2,.8,.4,1)' });

    svg.style.animationPlayState = 'paused';
    charWrap.classList.remove('hit');

    let mouth = null;

    const cleanup = () => {
      held.remove();
      if (mouth) mouth.remove();
      svg.style.animationPlayState = '';
      busy = false;
    };

    if (eat) {
      mouth = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      mouth.setAttribute('cx', 120);
      mouth.setAttribute('cy', 127);
      mouth.setAttribute('rx', 9.5);
      mouth.setAttribute('ry', 9);
      mouth.setAttribute('fill', '#6b241c');
      mouth.style.transformBox = 'fill-box';
      mouth.style.transformOrigin = '50% 50%';
      svg.appendChild(mouth);

      mouth.animate([
        { transform: 'scaleY(.05)' },
        { transform: 'scaleY(1)', offset: .18 },
        { transform: 'scaleY(.05)', offset: .34 },
        { transform: 'scaleY(1)', offset: .52 },
        { transform: 'scaleY(.05)', offset: .68 },
        { transform: 'scaleY(1)', offset: .82 },
        { transform: 'scaleY(.05)' }
      ], { duration: 1300, delay: 300, easing: 'ease-in-out', fill: 'both' });

      held.animate([
        { transform: 'translate(-50%,-50%) scale(1) rotate(0deg)', opacity: 1 },
        { transform: 'translate(-50%,-50%) scale(.72) rotate(-7deg)', opacity: 1, offset: .24 },
        { transform: 'translate(-50%,-50%) scale(.72) rotate(-7deg)', opacity: 1, offset: .34 },
        { transform: 'translate(-50%,-50%) scale(.46) rotate(8deg)', opacity: 1, offset: .52 },
        { transform: 'translate(-50%,-50%) scale(.46) rotate(8deg)', opacity: 1, offset: .62 },
        { transform: 'translate(-50%,-50%) scale(.2) rotate(-10deg)', opacity: 1, offset: .78 },
        { transform: 'translate(-50%,-50%) scale(.05) rotate(0deg)', opacity: 0, offset: .92 },
        { transform: 'translate(-50%,-50%) scale(.05) rotate(0deg)', opacity: 0 }
      ], { duration: 1250, delay: 300, easing: 'ease-in-out', fill: 'forwards' });

      const mxs = cr.left - sr.left + hx;
      const mys = cr.top - sr.top + hy;

      [620, 930, 1240].forEach((t) => {
        setTimeout(() => {
          for (let i = 0; i < 3; i++) {
            drop(mxs, mys, 3 + Math.random() * 4, 420 + Math.random() * 220,
              (Math.random() * 2 - 1) * 26, 28 + Math.random() * 38);
          }
        }, t);
      });

      charWrap.animate([
        { transform: 'translateX(-50%) translate(0,0) rotate(0) scale(1)' },
        { transform: 'translateX(-50%) translate(0,-8px) rotate(-1.6deg) scale(1.015)', offset: .1 },
        { transform: 'translateX(-50%) translate(0,0) rotate(0) scale(1)', offset: .2 },
        { transform: 'translateX(-50%) translate(0,-5px) rotate(1.3deg)', offset: .34 },
        { transform: 'translateX(-50%) translate(0,0) rotate(0)', offset: .46 },
        { transform: 'translateX(-50%) translate(0,-5px) rotate(-1.3deg)', offset: .6 },
        { transform: 'translateX(-50%) translate(0,0) rotate(0)', offset: .72 },
        { transform: 'translateX(-50%) translate(0,-4px) rotate(1deg)', offset: .84 },
        { transform: 'translateX(-50%) translate(0,0) rotate(0)', offset: .94 },
        { transform: 'translateX(-50%) translate(0,0) rotate(0)' }
      ], { duration: 1900, easing: 'ease-in-out' });

      setTimeout(cleanup, 1900);
    } else {
      held.animate([
        { opacity: 1 },
        { opacity: 1, offset: .55 },
        { opacity: 0, offset: .63 },
        { opacity: 0 }
      ], { duration: 2100, easing: 'linear', fill: 'forwards' });

      charWrap.animate([
        { transform: 'translateX(-50%) translate(0,0) rotate(0)' },
        { transform: 'translateX(-50%) translate(10px,0) rotate(5deg) scale(1.05,.95)', offset: .06 },
        { transform: 'translateX(-50%) translate(-8px,-14px) rotate(-6deg)', offset: .12 },
        { transform: 'translateX(-50%) translate(18vw,-30px) rotate(8deg)', offset: .26 },
        { transform: 'translateX(-50%) translate(32vw,4px) rotate(11deg)', offset: .36 },
        { transform: 'translateX(-50%) translate(48vw,-30px) rotate(13deg)', offset: .46 },
        { transform: 'translateX(-50%) translate(62vw,0) rotate(15deg)', offset: .56 },
        { transform: 'translateX(-50%) translate(62vw,0) rotate(15deg)', offset: .66 },
        { transform: 'translateX(-50%) translate(44vw,-26px) rotate(6deg)', offset: .78 },
        { transform: 'translateX(-50%) translate(28vw,2px) rotate(2deg)', offset: .86 },
        { transform: 'translateX(-50%) translate(10vw,-16px) rotate(-3deg)', offset: .94 },
        { transform: 'translateX(-50%) translate(0,0) rotate(0)' }
      ], { duration: 2100, easing: 'ease-in-out' });

      setTimeout(cleanup, 2100);
    }
  }

  /* ---------- character switch ---------- */

  document.querySelectorAll('.seg-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.char;
      if (key === current) return;
      current = key;

      girlEl.classList.toggle('active', key === 'girl');
      boyEl.classList.toggle('active', key === 'boy');

      document.querySelectorAll('.seg-btn').forEach((b) => {
        const on = b === btn;
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', String(on));
      });

      const el = key === 'girl' ? girlEl : boyEl;
      el.classList.remove('switching');
      void el.getBoundingClientRect();
      el.classList.add('switching');
    });
  });

  [girlEl, boyEl].forEach((el) => {
    el.addEventListener('animationend', (e) => {
      if (e.animationName === 'popIn') el.classList.remove('switching');
    });
  });

  /* ---------- reset ---------- */

  resetBtn.addEventListener('click', () => {
    score = 0;
    scoreEl.textContent = '0';
    hitsSinceBig = 0;
    bigThreshold = 100 + ((Math.random() * 201) | 0);
    snackHits = 0;
    snackThreshold = 10;

    splats.replaceChildren();
    juice.replaceChildren();
    pops.replaceChildren();
    ammo.replaceChildren();

    scoreBox.classList.remove('bump');
    void scoreBox.offsetWidth;
    scoreBox.classList.add('bump');
  });

  /* ---------- skin tone ---------- */

  const SKIN_DARK  = [51, 32, 26];
  const SKIN_MID   = [138, 85, 53];
  const SKIN_LIGHT = [255, 224, 200];

  function applySkin(value) {
    const t = value / 100;
    const lerp = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
    const base  = t < .5 ? lerp(SKIN_DARK, SKIN_MID, t * 2) : lerp(SKIN_MID, SKIN_LIGHT, (t - .5) * 2);
    const shade = lerp(base, [107, 60, 40], .22);
    const line  = lerp(base, [90, 50, 34], .45);
    const rgb   = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;
    const root  = document.documentElement.style;

    root.setProperty('--skin', rgb(base));
    root.setProperty('--skin-shade', rgb(shade));
    root.setProperty('--skin-line', rgb(line));
  }

  skinSlider.addEventListener('input', (e) => applySkin(e.target.value));
  applySkin(skinSlider.value);
</script>
</body>
</html>
